[package]
name = "framesw-obs-plugin"
version = "0.2.0"
edition = "2021"
publish = false
# GPL-2.0-or-later, matching OBS Studio's own licence. This plugin is loaded
# into OBS's process and calls libobs, so it is bound by that. Declared here as
# well as in LICENSE and the per-file SPDX headers, so `cargo metadata` and any
# automated licence scanner agree with the source rather than finding nothing.
# `version` above remains the single source of truth for both packaging
# scripts' VERSION stamping - do not duplicate it elsewhere.
license = "GPL-2.0-or-later"
description = "OBS Studio plugin reporting real audio levels for Preview-only sources, plus monitor-speaker audio taps over NDI."
repository = "https://github.com/hoversights/framesw-obs-plugin"

# Loaded directly by OBS Studio's own process as a native module — not a
# binary, not part of the main FrameSW app's build. Deliberately its own
# standalone Cargo project (not a workspace member of the root
# obs_controller package): entirely different target (a shared library OBS
# loads, not something `cargo run` ever produces), same "lives alongside
# src/, built/packaged independently" precedent as packaging/macos/ and
# marketing-site/.
[lib]
name = "framesw_obs_plugin"
crate-type = ["cdylib"]

# macOS/general logic is pure `std`/raw FFI, zero dependencies. Windows
# needs real Win32 API bindings for `platform.rs`'s symbol-resolution
# fallback (no RTLD_DEFAULT equivalent there) — using Microsoft's own
# `windows-sys` crate rather than hand-declaring WinAPI signatures, same
# "verify against real source, don't hand-port ABI-critical code" rule
# this crate follows for libobs itself.
[dependencies]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    # Reading FrameSW's InstallLocation to find the NDI runtime it bundles.
    "Win32_System_Registry",
    "Win32_System_Threading",
]
