name: Build

# Push-only, deliberately. NEVER add `pull_request`/`pull_request_target`
# here: this is a public repo, and those triggers run workflow code
# against whatever a fork's PR branch contains. That's fine on a
# GitHub-hosted runner (each run is a throwaway VM), but it's a standing
# invitation for a malicious PR to exfiltrate this job's secrets the
# moment anyone adds a secrets-consuming step to a fork-triggered
# workflow. Keep signing and `pull_request` permanently separated in
# this repo.
#
# The stakes rose on 2026-08-06: this workflow now holds BOTH the Apple
# Developer ID cert (+ password) and an Azure service principal that can
# sign anything as Hoversights. A leak of the latter lets someone sign
# malware with our public-trust identity — which would burn the
# SmartScreen reputation permanently, not just require a key rotation.
on:
  push:

# Least-privilege default: this workflow only builds and uploads
# artifacts, never writes back to the repo or opens anything.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Toolchain version comes from rust-toolchain.toml (repo root) —
      # rustup resolves and installs it automatically on the first
      # cargo/rustup invocation below, no separate install action
      # needed. Cross targets are explicit here (not in the toolchain
      # file) so a Windows checkout of this same file never tries to
      # pull macOS target components.
      - name: Add macOS cross-compile targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Zero unit tests exist in this crate today (verified — no #[test]
      # anywhere in src/). This step is wired up anyway so tests added
      # later run automatically; it's a no-op until then. Note that no
      # vendor request can be covered here regardless: those code paths
      # only ever run inside a live OBS process calling them over
      # obs-websocket, and nothing in CI can or should simulate that. Do
      # not add an integration test that tries to spin up real OBS.
      - name: Run unit tests
        run: cargo test --locked --target aarch64-apple-darwin

      # Imports the Developer ID Application cert into a throwaway
      # keychain scoped to this job, following Apple's own documented
      # CI pattern (create -> unlock -> import -> allow codesign to use
      # it without a GUI prompt via set-key-partition-list). The
      # keychain and the decoded .p12 are both deleted unconditionally
      # in the last step (`if: always()`), including on failure, so a
      # cancelled or failed run never leaves signing material sitting on
      # the (ephemeral, but still) runner's disk.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Append to the existing search list rather than hardcoding
          # "login.keychain" — the exact default keychain name/path
          # varies across runner images (some ship login.keychain-db).
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[\"[:space:]]//g')
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      # `--release` builds the universal (arm64 + x86_64) binary and
      # signs it with hardened runtime + a secure timestamp — see
      # package-macos.sh's own comment on why: this binary can never
      # hold its own stapled notarization ticket (no `stapler staple`
      # target for a bare bundle without an executable Info.plist entry
      # point), it rides FrameSW.app's notarization once bundled there,
      # and that only accepts a nested binary whose signature is already
      # notarization-ready.
      - name: Build and sign universal plugin
        run: ./package-macos.sh --release "$SIGN_IDENTITY"

      - name: Verify signature
        run: |
          set -euo pipefail
          BIN="target/framesw-companion.plugin/Contents/MacOS/framesw-companion"
          codesign -vvv --deep --strict "$BIN"
          codesign -dvvv "$BIN"
          echo "--- architectures ---"
          lipo -info "$BIN"

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          SHA="${GITHUB_SHA:0:7}"
          NAME="framesw-companion-${VERSION}-${SHA}-macos"
          (cd target && zip -r "../${NAME}.zip" framesw-companion.plugin)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
          # Explicit, not the (also 90-day) default — see CI.md for the
          # expiry/handoff implications for the app repo's fetch step.
          retention-days: 90

      # Runs even if an earlier step failed, so a signing failure never
      # leaves the imported cert sitting in a keychain on disk.
      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # See the macOS job's identical comment — toolchain version comes
      # from rust-toolchain.toml; windows-latest's host target
      # (x86_64-pc-windows-msvc) is already what package-windows.ps1
      # builds for, no extra `rustup target add` needed here.
      - name: Run unit tests
        run: cargo test --locked

      - name: Build plugin DLL
        run: powershell -NoProfile -File package-windows.ps1

      # Azure Artifact Signing — the product formerly called Azure Trusted
      # Signing. Microsoft renamed it, which is also why the IAM role is
      # "Artifact Signing Certificate Profile Signer" and why searching
      # the portal for "trusted" finds nothing.
      #
      # `endpoint`, `trusted-signing-account-name` and
      # `certificate-profile-name` are NOT secrets and are deliberately in
      # the clear: they identify which profile signed a binary, which
      # anyone can read out of the signature anyway. Only the service
      # principal's three credentials are secret.
      #
      # ─── DO NOT EVER RECREATE THE CERTIFICATE PROFILE ────────────────
      # SmartScreen reputation accrues to a signing identity, not to the
      # publisher or the product. Deleting `hoversights-public-trust` and
      # creating a new profile — even one with an identical name and
      # subject — restarts that reputation from zero, and every user sees
      # "Windows protected your PC" again until it rebuilds. This has
      # bitten other developers. If something looks wrong with signing,
      # fix whatever consumes the profile; never delete and recreate it.
      # ─────────────────────────────────────────────────────────────────
      #
      # PUBLIC TRUST profile, explicitly. "Public Trust Test" chains to a
      # test root that Windows does not trust — it yields a signature
      # which verifies under the right flags but is rejected on a real
      # user's machine. That is the worst available failure mode, because
      # CI would go green while every download stayed broken. "Private
      # Trust" is for enterprise-internal allow-listing and is equally
      # wrong here.
      #
      # Signs on every push, matching the macOS job. An unsigned artifact
      # escaping unnoticed is the exact failure this prevents, so there is
      # deliberately no branch condition.
      - name: Sign plugin DLL (Azure Artifact Signing)
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: hoversights
          certificate-profile-name: hoversights-public-trust
          files-folder: ${{ github.workspace }}\target\framesw-companion\bin\64bit
          files-folder-filter: dll
          file-digest: SHA256
          # Timestamping is what makes these signatures outlive the
          # certificate, which Artifact Signing deliberately issues with
          # only ~3 days of validity. Without it, every shipped build
          # would stop validating within days. The action already defaults
          # to this URL; set explicitly so nobody removes it believing it
          # to be optional.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Verifying separately, rather than trusting the signing step's exit
      # code, is deliberate: that step succeeding means "the service
      # accepted the request", not "the artifact a user downloads will
      # validate on their machine".
      - name: Verify signature
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Dll = "target\framesw-companion\bin\64bit\framesw-companion.dll"
          if (-not (Test-Path $Dll)) { throw "DLL not found at $Dll" }

          # signtool ships with the Windows SDK and is not on PATH on the
          # hosted runner. Take the highest-versioned x64 copy present.
          $SignTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $SignTool) { throw "signtool.exe not found on this runner" }
          Write-Host "Using $($SignTool.FullName)"

          # /pa = Default Authenticode Verification Policy: the same
          # policy Windows itself applies to a downloaded binary.
          $Output = & $SignTool.FullName verify /pa /v $Dll 2>&1 | Out-String
          Write-Host $Output
          if ($LASTEXITCODE -ne 0) {
              throw "signtool verify /pa FAILED - the artifact is not trusted"
          }

          # Checked explicitly rather than assumed: an untimestamped
          # signature passes /pa today and begins failing in ~3 days, long
          # after CI went green.
          if ($Output -notmatch "(?i)timestamp") {
              throw "Signature carries NO timestamp - it would stop validating once the certificate expires"
          }
          Write-Host "Verified: trusted chain + timestamp present."

      - name: Package artifact
        id: package
        run: |
          $Version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $Sha = $env:GITHUB_SHA.Substring(0, 7)
          $Name = "framesw-companion-$Version-$Sha-windows"
          Compress-Archive -Path target\framesw-companion -DestinationPath "$Name.zip"
          "name=$Name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 90
